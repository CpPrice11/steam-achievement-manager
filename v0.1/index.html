<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar" id="sidebar">
        <header class="brand">
          <div>
            <h1></h1>
            <p id="steamStatus"></p>
          </div>
          <button id="refreshButton">↻</button>
        </header>

        <div class="sidebar-controls">
          <label class="field">
            <span></span>
            <input id="gameSearch" type="search" autocomplete="off" />
          </label>
          <label class="toggle-field">
            <input id="gamesWithAchievementsOnly" type="checkbox" />
            <span></span>
          </label>
          <label class="field compact-field">
            <span></span>
            <select id="gameRiskFilter">
              <option value="all"></option>
              <option value="safe"></option>
              <option value="risky"></option>
            </select>
          </label>
          <label class="field compact-field">
            <span id="gameSortLabel"></span>
            <select id="gameSort">
              <option value="name"></option>
              <option value="appid">AppID</option>
              <option value="achievements-first"></option>
              <option value="risk-first"></option>
              <option value="issues-first"></option>
            </select>
          </label>
          <div class="sidebar-meta">
            <div id="gameCount" class="game-count"></div>
            <button id="libraryDiagnosticsButton" class="sidebar-action"></button>
          </div>
        </div>
        <div id="gameList" class="game-list"></div>
      </aside>

      <div class="sidebar-resizer" aria-hidden="true"></div>

      <section class="content">
        <div class="toolbar">
          <div>
            <p class="eyebrow" id="selectedAppId"></p>
            <h2 id="selectedGame"></h2>
          </div>
          <div class="settings">
            <button id="openSteamButton" class="icon-text-button" disabled>
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
              Steam
            </button>
            <button id="refreshGameButton" class="icon-text-button" disabled>
              <svg aria-hidden="true" viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.2"/></svg>
              <span id="refreshGameLabel"></span>
            </button>
            <button id="appearanceSettingsButton" class="icon-button">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5Z"></path>
                <path d="M19.4 15a1.8 1.8 0 0 0 .36 1.98l.06.06a2.1 2.1 0 0 1-2.97 2.97l-.06-.06a1.8 1.8 0 0 0-1.98-.36 1.8 1.8 0 0 0-1.09 1.65V21.5a2.1 2.1 0 0 1-4.2 0v-.09a1.8 1.8 0 0 0-1.09-1.65 1.8 1.8 0 0 0-1.98.36l-.06.06a2.1 2.1 0 0 1-2.97-2.97l.06-.06a1.8 1.8 0 0 0 .36-1.98 1.8 1.8 0 0 0-1.65-1.09H2.5a2.1 2.1 0 0 1 0-4.2h.09a1.8 1.8 0 0 0 1.65-1.09 1.8 1.8 0 0 0-.36-1.98l-.06-.06a2.1 2.1 0 0 1 2.97-2.97l.06.06a1.8 1.8 0 0 0 1.98.36h.01A1.8 1.8 0 0 0 9.9 2.5v-.09a2.1 2.1 0 0 1 4.2 0v.09a1.8 1.8 0 0 0 1.09 1.65 1.8 1.8 0 0 0 1.98-.36l.06-.06a2.1 2.1 0 0 1 2.97 2.97l-.06.06a1.8 1.8 0 0 0-.36 1.98v.01a1.8 1.8 0 0 0 1.65 1.09h.09a2.1 2.1 0 0 1 0 4.2h-.09A1.8 1.8 0 0 0 19.4 15Z"></path>
              </svg>
            </button>
          </div>
          <div id="appearancePanel" class="appearance-panel hidden">
            <label>
              <span id="uiLanguageLabel"></span>
              <select id="languageInput">
                <option value="ukrainian"></option>
                <option value="english"></option>
              </select>
            </label>
            <label>
              <span id="themeLabel"></span>
              <select id="themeInput">
                <option value="dark"></option>
                <option value="light"></option>
                <option value="system"></option>
              </select>
            </label>
            <label>
              <span id="uiScaleLabel"></span>
              <select id="uiScaleInput">
                <option value="compact"></option>
                <option value="normal"></option>
                <option value="large"></option>
              </select>
            </label>
            <label>
              <span id="apiKeyLabel"></span>
              <input id="apiKeyInput" type="password" autocomplete="off" />
            </label>
            <button id="saveSettingsButton"></button>
          </div>
        </div>

        <div id="gameBanner" class="game-banner hidden" aria-hidden="true"></div>
        <div id="notice" class="notice hidden"></div>
        <div id="loadingIndicator" class="loading-indicator hidden" role="status" aria-live="polite">
          <span class="loading-spinner" aria-hidden="true"></span>
          <span class="loading-copy">
            <strong id="loadingText"></strong>
            <small id="loadingDetail"></small>
          </span>
        </div>

        <nav class="tabs">
          <button class="tab active" data-tab="achievements"></button>
          <button class="tab" data-tab="stats"></button>
          <button class="tab" data-tab="history"></button>
        </nav>

        <section id="achievementsPanel" class="panel active">
          <div class="achievement-control-deck">
            <div class="filter-row">
              <div class="achievement-filters" role="group">
                <button class="filter-chip active" data-achievement-filter="all" type="button"></button>
                <button class="filter-chip" data-achievement-filter="unlocked" type="button"></button>
                <button class="filter-chip" data-achievement-filter="locked" type="button"></button>
                <button class="filter-chip" data-achievement-filter="changed" type="button"></button>
              </div>
              <div class="source-filters" role="group">
                <button class="source-chip active" data-dlc-filter="all" type="button"></button>
                <button class="source-chip" data-dlc-filter="base" type="button"></button>
                <button class="source-chip" data-dlc-filter="dlc" type="button"></button>
              </div>
            </div>
            <div id="progressSummary" class="progress-summary hidden">
              <div>
                <strong id="progressText"></strong>
                <span id="progressPercent">0%</span>
              </div>
              <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
            </div>
            <div class="panel-head">
              <input id="achievementSearch" type="search" />
              <div class="bulk-actions">
                <button id="unlockAllButton" class="bulk-button unlock" disabled>
                  <svg class="bulk-icon unlock-icon" aria-hidden="true" viewBox="0 0 24 24">
                    <rect x="5" y="10" width="14" height="10" rx="2"></rect>
                    <path d="M8 10V7a4 4 0 0 1 7.6-1.8"></path>
                    <path d="M12 14v3"></path>
                  </svg>
                </button>
                <button id="lockAllButton" class="bulk-button lock" disabled>
                  <svg class="bulk-icon lock-icon" aria-hidden="true" viewBox="0 0 24 24">
                    <rect x="5" y="10" width="14" height="10" rx="2"></rect>
                    <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                    <path d="M12 14v3"></path>
                  </svg>
                </button>
                <button id="applyAchievementChangesButton" class="bulk-button apply" disabled>
                  <svg class="bulk-icon apply-icon" aria-hidden="true" viewBox="0 0 24 24">
                    <path d="M20 6 9 17l-5-5"></path>
                  </svg>
                </button>
                <button id="cancelPendingChangesButton" class="bulk-button cancel" disabled>
                  <svg class="bulk-icon cancel-icon" aria-hidden="true" viewBox="0 0 24 24">
                    <path d="M18 6 6 18"></path>
                    <path d="m6 6 12 12"></path>
                  </svg>
                </button>
              </div>
              <span id="achievementCount">0</span>
            </div>
            <div id="selectionBar" class="selection-bar hidden">
              <span id="selectionCount"></span>
              <div class="selection-actions">
                <button id="unlockSelectedButton" type="button"></button>
                <button id="lockSelectedButton" type="button"></button>
              </div>
              <button id="clearSelectionButton" type="button" class="selection-clear">✕</button>
            </div>
          </div>
          <div id="achievementList" class="achievement-list empty-state"></div>
        </section>

        <section id="statsPanel" class="panel">
          <div class="stats-control-deck">
            <div id="gameDiagnostics" class="diagnostics-card empty-state"></div>
            <div class="panel-head">
              <button id="loadStatsButton"></button>
              <button id="resetStatsButton"></button>
              <button id="steamworksDiagnosticsButton"></button>
              <span id="statsCount">0</span>
            </div>
            <div class="panel-head stats-filter-head">
              <input id="statsSearch" type="search" />
              <select id="statsTypeFilter">
                <option value="all"></option>
                <option value="editable"></option>
                <option value="readonly"></option>
                <option value="unsupported"></option>
              </select>
            </div>
          </div>
          <div id="statsList" class="stats-list empty-state"></div>
        </section>

        <section id="historyPanel" class="panel">
          <div class="panel-head compact">
            <button id="refreshHistoryButton"></button>
            <button id="openBackupsFolderButton"></button>
            <span id="historyCount">0</span>
          </div>
          <div id="historyList" class="history-list empty-state"></div>
        </section>
      </section>
    </main>
    <dialog id="appDialog" class="app-dialog" aria-labelledby="appDialogTitle" aria-describedby="appDialogMessage appDialogDiff">
      <form method="dialog" class="app-dialog-content">
        <h3 id="appDialogTitle"></h3>
        <p id="appDialogMessage"></p>
        <div id="appDialogDiff" class="app-dialog-diff hidden" role="list"></div>
        <div class="app-dialog-actions">
          <button id="appDialogCancel" type="submit" value="cancel"></button>
          <button id="appDialogConfirm" type="submit" value="confirm" class="app-dialog-confirm"></button>
        </div>
      </form>
    </dialog>
    <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="false"></div>
    <script src="./domain/achievement-diff.js"></script>
    <script src="./domain/history-undo.js"></script>
    <script src="./renderer.js"></script>
  </body>
</html>
